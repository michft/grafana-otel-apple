name: PR Labels

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply vouch and size labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const vouchedPath = '.github/VOUCHED.txt';
            const vouchedRaw = fs.existsSync(vouchedPath)
              ? fs.readFileSync(vouchedPath, 'utf8')
              : '';

            const vouched = new Set(
              vouchedRaw
                .split('\n')
                .map((line) => line.trim())
                .filter((line) => line && !line.startsWith('#'))
            );

            const vouchLabel = vouched.has(author)
              ? 'vouch:vouched'
              : 'vouch:unvouched';

            const changedLines = (pr.additions || 0) + (pr.deletions || 0);

            let sizeLabel = 'size:xs';
            if (changedLines > 1000) {
              sizeLabel = 'size:xl';
            } else if (changedLines > 500) {
              sizeLabel = 'size:l';
            } else if (changedLines > 200) {
              sizeLabel = 'size:m';
            } else if (changedLines > 50) {
              sizeLabel = 'size:s';
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number,
            });

            const removableLabels = currentLabels
              .map((label) => label.name)
              .filter((name) => name.startsWith('vouch:') || name.startsWith('size:'));

            for (const name of removableLabels) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name,
              }).catch(() => {});
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [vouchLabel, sizeLabel],
            });
